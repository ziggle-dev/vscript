# Repo-wide Gradle settings.
#
# These came from `vscript-idea` when it was folded in. The IntelliJ Platform build is the demanding
# one — it needs the heap and it does not work with the configuration cache — and Gradle reads this file
# once for the whole build, so they apply to every module. Harmless for the others: the language build was
# not using the configuration cache anyway, and a larger heap costs nothing when it is not needed.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
org.gradle.caching=true
org.gradle.configuration-cache=false

# The language artifact this plugin links. `settings.gradle.kts` substitutes a sibling `../vscript`
# checkout when there is one, so this pin only matters to a fresh clone.
vscriptVersion=1.1.0
vscriptNodesVersion=1.53.0

# The IDE to build against. Toolbox puts IDEA here by default; override per machine in
# ~/.gradle/gradle.properties or with -PideHome=...
ideHome=C:\\Users\\Admin\\AppData\\Local\\Programs\\IntelliJ IDEA
