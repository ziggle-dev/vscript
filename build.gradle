/*
 * The root of the language repo — a coordinator, and deliberately almost empty.
 *
 * ### Why there is a root project at all
 *
 * This repo was ONE module until the modules the split plan calls for arrived: `:vscript-lang` is the
 * language, and the runtime, the widget kit and the two editing surfaces come in beside it. A root that
 * declares the things every module shares is what keeps those modules from each repeating the Kotlin
 * version, the toolchain and the publishing block — and repeating them is how two of them come to be
 * compiled by different compilers, which is a class of bug this repo has already paid for once.
 *
 * What is NOT here: dependencies. Each module states its own, because the whole point of the split is
 * that the arrows between them are visible and enforced. A `subprojects { dependencies { … } }` block
 * would make every module depend on everything and quietly undo that.
 */
plugins {
    // Applied `apply false` so the version is stated once and each module opts in. Declaring it here
    // without this makes the root a Kotlin project too, which it is not — it has no source.
    id 'org.jetbrains.kotlin.jvm' version '2.3.21' apply false
}

/**
 * Send a module's whole output somewhere else — `gradlew.bat test -PoutDir=build-x`.
 *
 * **So a build can run while the client is up.** A running client holds the language jar open and Windows
 * will not let Gradle replace it; the failure is not "the jar is locked" but a HALF-WRITTEN jar, which the
 * live client then reports as a bare missing-class name from `graph check` — a symptom that reads like a
 * source problem and is not one. Pointing the build at its own directory means the file the client is
 * using is never opened for writing at all.
 *
 * **Per module, resolved against the MODULE.** `-PoutDir=build-x` puts `:vscript-lang`'s output in
 * `vscript-lang/build-x`, not in a shared one every module would then fight over. That is why this is
 * `subprojects` and not `allprojects` with a single path.
 *
 * Deliberately not named `buildDir`: that is a Gradle project property of its own and setting it from the
 * command line means something else.
 */
subprojects {
    /*
     * **In THIS build, `dev.ziggle:vscript` is `:vscript-lang`.**
     *
     * It has to be said, because a consumer can arrive at the language two ways at once. `:vscript-idea`
     * depends on `:vscript-lang` as a project AND on the published `dev.ziggle:vscript-nodes`, which brings
     * `dev.ziggle:vscript` with it — so without this the classpath carries the project's classes and a
     * published jar's, and whichever wins decides. It resolved to the jar, and the plugin's tests failed
     * 205-of-433 with `NoSuchMethodError` on a constructor that is plainly right there in the source.
     *
     * The other repos say the same thing in their `includeBuild` blocks. This is that statement for the
     * build where the language is not an included build but a module.
     */
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('dev.ziggle:vscript') using project(':vscript-lang')
        }
    }

    /*
     * Publish into a plain Maven tree under `build/maven-repo`, which the release workflow pushes to the
     * `maven` branch of THIS repo.
     *
     * **This repo is public, so that tree is readable with no credentials** — a consumer adds one URL and
     * resolves `dev.ziggle:*` anonymously. That is the whole reason to serve it from here rather than from
     * a private mirror: no token to hand out, no account to have.
     *
     * There was a real bug waiting behind the absence of this. Every module already declared publications
     * but nothing declared a repository, so `publish` had nowhere to go and only `publishToMavenLocal`
     * worked — which is why `io.osrsx:osrsx-nodes` ships a POM depending on `dev.ziggle:vscript:1.2.0`
     * that resolves from nowhere. osrsx-client never noticed because it composes this build in and
     * substitutes the module; anyone else consuming the SDK could not build at all.
     */
    plugins.withId('maven-publish') {
        publishing {
            repositories {
                maven {
                    name = 'rawRepo'
                    url = rootProject.layout.buildDirectory.dir('maven-repo')
                }
            }
        }
    }

    if (rootProject.hasProperty('outDir')) {
        layout.buildDirectory = file(rootProject.property('outDir'))
    }
    group = 'dev.ziggle'
    // The LANGUAGE's version, deliberately not the client's. A consumer — the IntelliJ plugin above all —
    // needs to be able to say "this document/catalogue is newer than I understand", which is the same job
    // GraphDoc.FORMAT already does for documents and which a client version number cannot do.
    //
    // One number for the repo rather than one per module: they are released together and a consumer
    // pinning three versions that must match is a consumer with three ways to get it wrong.
    //
    // 1.4.0: MINOR -- a pack can be INSTALLED and run, which is the last thing between a `.vspack` and a
    // client that runs one. `runtime.PackStore` is the folder of them (beside the documents, not among
    // them -- a `.vspack` answers to no import reference and has no business in a tree every index walks),
    // and `graph pack list | info <id> | run <id>` drives it over the same socket as everything else.
    //
    // Headers are read; programs are not. Listing is something a UI does on every refresh, and decoding a
    // program to print a name would mean reading nineteen hundred functions to answer it.
    //
    // `ScriptRuntime.hostNames` is public so a caller can ask "would this run here" before there is
    // anything to refuse -- `pack info` answers it, and `pack run` refuses on the same comparison.
    //
    // 1.3.1: PATCH -- the codec and the checker, corrected against a real corpus of 117 documents. Every
    // one of these was found by packing that corpus, not by reasoning about the code.
    //
    // **A constant pool is not only the values a document writes.** The compiler parks its own machinery
    // there: `StructShape` (so an instruction can build a record), `FunctionValue` (a function as a value,
    // an index into the linked table plus what it closed over) and `JsonSchema` (the shape an `as` cast
    // decodes against, nine Shape variants deep). The first cut rejected all three as "a live host value
    // that should never have been put there" -- a message confidently wrong about its own compiler, and it
    // meant no script declaring a record could be packed at all.
    //
    // `PackMain` now reads back what it wrote, off disk, and re-derives the host set from the bytecode. A
    // build tool that only ever encodes finds out its encoder is wrong on somebody else's machine.
    //
    // The whole-tree check told the truth about a corpus for the first time, having been wrong twice. It walked `refs`, which holds several aliases per document, so every file was compiled
    // two or three times and every error reported as many; and it compiled a `_test` document through the
    // ordinary door, which does not grant access to the internals of the module under test -- so every
    // private function a test exercises came back as "no function called", reading as a broken suite.
    //
    // 1.3.0: MINOR -- a compiled program can be WRITTEN DOWN, and there is a build tool for it. All
    // additive; nothing that compiled before compiles differently.
    //
    // `vm.ChunkCodec` serialises a program to bytes and back, import closure and all -- TextFrontEnd
    // already flattens a document and everything it imports into one shared function table, so an image is
    // the whole closure or it is nothing. Portable because host calls resolve by NAME at load, never by a
    // catalogue index. `write(strip = true)` drops what only an editor and a debugger read; `debug = false`
    // does NOT do that on its own, which is worth knowing before shipping one.
    //
    // `text.CompiledPack` adds the entry table a runtime dispatches on, and `requiredHosts()` -- the
    // compatibility question answered exactly, rather than by comparing versions. `text.VsPackFile` is the
    // distributable `.vspack`: a manifest anyone can read beside bytecode it is verified against.
    // `runtime.ScriptRuntime.runPack` runs one through the real phase machine, refusing up front when this
    // host lacks a verb the pack calls.
    //
    // `tools.FolderSource` is the import root a build tool compiles against, with ModuleNames' rules --
    // path, declared name, and the `mod.vs` front door. `tools.PackMain` is the worker behind the new
    // `dev.ziggle.vscript` Gradle plugin (`:vscript-gradle`), which wires the repository and the language
    // for a consumer and adds check/pack/editor tasks.
    //
    // 1.2.0: MINOR -- five calendar verbs (`localDate`, `hourOfDay`, `minuteOfHour`, `dayOfWeek`,
    // `msUntilLocal`) on an injectable `java.time.Clock`, and `as` now keeps its type arguments so a
    // document decodes straight into `LIST<T>` / `MAP<STRING, T>` instead of needing a record declared to
    // wrap it in. Both are additive: the clock defaults to the system one, and a target with arguments
    // used to be a parse error, so nothing that compiled before compiles differently now.
    version = '1.4.0'
}
